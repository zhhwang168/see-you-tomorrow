const language = document.querySelector('#language');
const locales = ['en', 'zh-CN', 'ja'];
const labels = new Map();
let locale = localStorage.getItem('tomorrow.locale');
if (!locales.includes(locale)) locale = 'en';

const selectedMember = new URLSearchParams(location.search).get('member');
const memberId = ['nora','room'].includes(selectedMember) ? selectedMember : 'mira';
const inRoom = memberId === 'room';
const memberKey = key => memberId === 'mira' ? key : key + '.' + memberId;
const topicStorageKey = memberKey('tomorrow.returnTopic');
let awaitingTopic = false;


function translate(text) {
  const recalled = /^Welcome home\. How did this go\? (.+)$/s.exec(text);
  if (recalled) return {
    en: 'Welcome home. How did this go? ',
    'zh-CN': '回来啦。上次你提到这件事，后来怎么样了？',
    ja: 'おかえり。前に話してくれたこと、その後どうだった？ '
  }[locale] + recalled[1];
  const choice = locales.indexOf(locale);
  const scene = /^场景 (.+)$/.exec(text);
  if (scene) return ['Scene ', '场景 ', 'シーン '][choice] + scene[1];
  const switched = /^Sure\. Switching to scene (\d+)\.$/.exec(text);
  if (switched) return ['Sure. Switching to scene $1.', '好，切到场景 $1。', 'シーン $1 に切り替えるね。'][choice].replace('$1', switched[1]);
  const range = /^You can choose a scene from 1 to (\d+)\.$/.exec(text);
  if (range) return ['You can choose a scene from 1 to $1.', '可以选 1 到 $1 号场景。', '1 から $1 のシーンを選べるよ。'][choice].replace('$1', range[1]);

function speechText(text) {

    .replace(/\[\s*(?:mood\s*:\s*)?(?:neutral|happy|concerned|upset|sad|angry|excited)\s*\]|<(?:neutral|happy|concerned|upset|sad|angry|excited)>/gi, '')
    .replace(/\b(?:smiling face with smiling eyes|grinning face with smiling eyes|face with tears of joy|slightly smiling face)\b/gi, '')
    .replace(/\p{RGI_Emoji}/gv, '')
    .replace(/\p{Extended_Pictographic}|\p{Emoji_Modifier}|[\uFE0E\uFE0F\u200D]/gu, '')
    .replace(/\s+([,.!?;:])/g, '$1')

async function readReply(text, preview = false, bubble, delivery = {speaker:member, mood:'neutral'}) {
  if (!speakingEnabled && !preview && !liveMode) return;
  text = speechText(text);
  if (!text) {
    if (bubble) showExpression(delivery.mood, delivery.speaker);
    return;
  }
  stopSpeech();
  const current = new AbortController();
  speechRequest = current;
  try {
    if (/[\u3040-\u30ff\u3400-\u9fff]/.test(text)) {
      label(speechStatus, 'Kokoro preview currently supports English replies.');
      return;
    }
    label(speechStatus, '正在合成语音…');
    const response = await fetch('/speech', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:text.slice(0, 1200), voice:preview ? voiceChoice.value : delivery.speaker.voice}), signal:current.signal
    });
    if (!response.ok) throw Error(await response.text());
    const audio = await response.blob();
    if (current.signal.aborted) return;
    if (bubble) {
      const replay = document.createElement('button');
      replay.type = 'button';
      replay.className = 'reply-audio';
      label(replay, '播放回复');
      replay.onclick = () => {

      };

      messages.scrollTop = messages.scrollHeight;
    }
    await playAudio(audio, delivery);
  } catch (error) {
    if (!current.signal.aborted) label(speechStatus, error.name === 'NotAllowedError' && bubble ? '浏览器阻止了自动播放，请点击播放回复。' : error.message);

  }
}

async function playAudio(audio, {speaker, mood}) {
  const version = playbackVersion;
  const showSpeaker = () => {
    if (version !== playbackVersion) return;
    showExpression(mood, speaker);
    label(speechStatus, speaker.name + ' is speaking.');
  };
  if (audioContext?.state === 'running') {
    const buffer = await audioContext.decodeAudioData(await audio.arrayBuffer());
    if (version !== playbackVersion) return;
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.onended = () => {
      source.disconnect();
      if (activeSource !== source) return;
      activeSource = undefined;
      label(speechStatus, '');
    };
    source.start();
    activeSource = source;
    showSpeaker();
    return;
  }
  audioUrl = URL.createObjectURL(audio);
  player.src = audioUrl;
  await player.play();
  showSpeaker();
}

const turns = [];
let pendingTurns = 0;
let releasingModels = false;
let conversationQueue = Promise.resolve();

function converse(text) {
  text = text.trim();
  if (!text || releasingModels) return conversationQueue;
  if (inRoom && !guests.length) {
    label(speechStatus, 'Invite at least one member before chatting.');
    return conversationQueue;
  }
  const invited = [...guests];
  const userBubble = say(text, true);
  record('user', text);
  pendingTurns++;
  conversationQueue = conversationQueue.then(() => inRoom ? roomTurn(text, userBubble, invited) : answerTurn(text, userBubble))
    .catch(error => label(speechStatus, error.message))
    .finally(() => { pendingTurns--; });
  return conversationQueue;
}

async function roomTurn(text, anchor, invited) {
  let previous;
  for (const speaker of invited) {
    const result = await answerTurn(text, anchor, speaker, previous, invited);
    anchor = result.bubble;
    if (result.answer) previous = {name:speaker.name, text:result.answer};
  }
}

function parseReply(raw, name, complete = false) {
  let text = raw.trimStart();
  let mood = 'neutral';
  const prefix = name.toLowerCase() + ':';
  while (text) {
    const lower = text.toLowerCase();
    if (lower.startsWith(prefix)) {
      text = text.slice(prefix.length).trimStart();
      continue;
    }
    const tag = /^\[(neutral|happy|concerned|upset)\]\s*/i.exec(text);
    if (tag) {
      mood = tag[1].toLowerCase();
      text = text.slice(tag[0].length).trimStart();
      continue;
    }
    if (!complete && (prefix.startsWith(lower) || (text.startsWith('[') && !text.includes(']') && text.length < 16))) text = '';
    break;
  }
  return {text, mood};
}

async function answerTurn(text, userBubble, speaker = member, previous, invited = []) {
  const action = inRoom ? null : reply(text);
  renderTopic();
  if (action) {
    const actionMood = action.startsWith('Welcome home.') || action.startsWith('Hi.') ? 'happy' : 'neutral';
    const actionBubble = say(action);
    userBubble.after(actionBubble);
    record('assistant', action);
    if (!releasingModels) queueReply(action.startsWith('Welcome home. How did this go? ')
      ? 'Welcome home. How did the thing you mentioned last time go?' : action, actionBubble, member, actionMood);
    return;
  }

  const bubble = say('…');
  userBubble.after(bubble);
  labels.delete(bubble);
  let answer = '';
  let rawReply = '';
  let mood = 'neutral';
  try {
    const user = {role:'user', content:text};
    const room = inRoom ? {participants:invited.map(guest => guest.name), previous} : undefined;
    const response = await fetch('/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ turns: [...turns.slice(-10), user], member:speaker, room, topic: localStorage.getItem(topicStorageKey) })
    });
    if (!response.ok) throw new Error(await response.text());
    let pending = '';
    let complete = false;
    for await (const chunk of response.body.pipeThrough(new TextDecoderStream())) {
      pending += chunk;
      const lines = pending.split('\n');
      pending = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const item = JSON.parse(line);
        if (item.error) throw new Error('Ollama could not generate a reply.');
        complete ||= item.done === true;
        rawReply += item.message?.content || '';
        const parsed = parseReply(rawReply, speaker.name, complete);
        answer = parsed.text;
        mood = parsed.mood;
        bubble.textContent = (inRoom ? speaker.name + ': ' : '') + (answer || '…');
        messages.scrollTop = messages.scrollHeight;
      }
    }
    if (!answer || !complete) throw new Error('The local model did not finish its reply.');
    turns.push(user, { role: 'assistant', content: ((inRoom ? speaker.name + ': ' : '') + answer).slice(0, 2000) });
    if (turns.length > 12) turns.splice(0, 2);
    answer = answer.trim();
    bubble.textContent = (inRoom ? speaker.name + ': ' : '') + answer;
    record('assistant', answer, speaker);
    if (!releasingModels) queueReply(answer, bubble, speaker, mood);
    return {bubble, answer};
  } catch (error) {
    bubble.textContent = answer ? answer + '\n' + error.message : error.message;
    return {bubble};
  }
}

async function findLocalEnglish(recognition, onDownload) {
  const downloadable = [];
  for (const lang of ['en-US', 'en-GB', 'en-AU', 'en-CA']) {
    const options = {langs:[lang], processLocally:true};
    const status = await recognition.available(options);
    if (status === 'available') return lang;
    if (status === 'downloadable' || status === 'downloading') downloadable.push(options);
  }
  for (const options of downloadable) {
    onDownload();
    if (await recognition.install(options).catch(() => false)) return options.langs[0];
  }
  return null;
}
let listener;

function stopListening(message) {
  const current = listener;
  listener = undefined;
  if (liveMode) { cancelQueuedReplies(); stopSpeech(); }
  liveMode = false;
  live.setAttribute('aria-pressed', 'false');
  label(live, '开始实时对话');
  current?.abort();
  wake.setAttribute('aria-pressed', 'false');
  label(wake, '开启 Hey Mira 唤醒');
  label(wakeStatus, message);
}

async function startListening(handsFree) {
  if (listener) {
    const sameMode = handsFree === liveMode;
    stopListening('麦克风已关闭');
    if (sameMode) return;
  }
  wake.disabled = live.disabled = true;
  try {
    if (!Recognition?.available || !Recognition?.install) {
      label(wakeStatus, '此浏览器不支持离线识别。请用支持本机识别的 Chrome 打开。');
      return;
    }
    const recognizer = new Recognition();
    if (!('processLocally' in recognizer)) throw new Error('此浏览器无法在本机识别。');
    label(wakeStatus, '正在检查英文识别语言包…');
    const language = await findLocalEnglish(Recognition, () => {
      label(wakeStatus, '正在安装英文识别语言包…');
    });
    if (!language) throw Error('Offline English speech recognition is unavailable here. Open http://127.0.0.1:3081/ directly in Google Chrome, or use Record voice message for local Whisper.');
    recognizer.lang = language;
    recognizer.processLocally = true;
    recognizer.continuous = !handsFree;
    let responding = false;
    let awakeUntil = 0;
    recognizer.onresult = async event => {
      if (listener !== recognizer || queuedReplies || isPlaying()) return;
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (!event.results[i].isFinal) continue;
        const text = event.results[i][0].transcript.trim();
        if (handsFree) {
          if (!text || responding) return;
          responding = true;
          label(wakeStatus, 'Mira 正在回应…');
          try { await converse(text); }
          finally { responding = false; }
          return;
        }
        const phrase = (memberId === "nora" ? /^hey[\s,]+nora\b[\s,.!?:]*/i : /^hey[\s,]+(?:mira|meera)\b[\s,.!?:]*/i).exec(text);
        if (!phrase && Date.now() >= awakeUntil) continue;
        const command = phrase ? text.slice(phrase[0].length).trim() : text;
        if (!command) {
          awakeUntil = Date.now() + 8000;
          label(wakeStatus, 'Mira 在听，请在 8 秒内说出指令。');
          continue;
        }
        awakeUntil = 0;
        label(wakeStatus, '正在等待「Hey Mira」');
        converse(command);
      }
    };
    recognizer.onaudiostart = () => {
      if (listener === recognizer && handsFree) label(wakeStatus, '正在听，请说英语');
    };
    recognizer.onerror = event => {
      if (listener === recognizer && event.error !== 'no-speech') {
        stopListening(['not-allowed','service-not-allowed'].includes(event.error)
          ? '请允许此页面使用麦克风。'
          : '本机语音识别已停止（' + event.error + '）。');
      }
    };
    recognizer.onend = () => {
      if (listener !== recognizer) return;
      const resume = () => {
        if (listener !== recognizer) return;
        if (handsFree && (responding || pendingTurns || queuedReplies || speechRequest || isPlaying())) {
          setTimeout(resume, 200);
          return;
        }
        try {
          recognizer.start();
          if (handsFree) label(wakeStatus, '正在连接麦克风…');
        } catch { stopListening('麦克风连接中断，请重新开启。'); }
      };
      setTimeout(resume, 300);
    };
    listener = recognizer;
    liveMode = handsFree;
    recognizer.start();
    const activeButton = handsFree ? live : wake;
    activeButton.setAttribute('aria-pressed', 'true');
    label(activeButton, handsFree ? '结束实时对话' : '关闭语音唤醒');
    label(wakeStatus, handsFree ? '正在连接麦克风…' : '试说「Hey Mira, I am back」');
  } catch (error) {
    stopListening(error.message);
  } finally {
    wake.disabled = live.disabled = false;
  }
}
wake.onclick = () => { unlockAudio(); return startListening(false); };
live.onclick = async () => {
  if (!liveMode) {
    unlockAudio();
    return startListening(true);
  }
  releasingModels = true;
  stopListening('麦克风已关闭');
  live.disabled = wake.disabled = speech.disabled = voicePreview.disabled = true;
  const submit = document.querySelector('#chat-form button');
  submit.disabled = true;
  label(speechStatus, 'Releasing model memory…');
  try {
    await conversationQueue;
    await replyQueue;
    const response = await fetch('/models/release', {method:'POST'});
    if (!response.ok) throw Error(await response.text());
    label(speechStatus, 'Model memory released. Saved chats are still available.');
  } catch (error) {
    label(speechStatus, error.message);
  } finally {
    releasingModels = false;
    live.disabled = wake.disabled = speech.disabled = voicePreview.disabled = submit.disabled = false;
  }
};
window.addEventListener('pagehide', () => stopListening('麦克风已关闭'));
document.querySelector('#chat-form').onsubmit = event => {
  event.preventDefault();
  if (releasingModels) return;
  unlockAudio();
  converse(input.value);
  input.value = '';
};
for (const button of document.querySelectorAll('.suggestions button[data-command]:not(#voice-preview)')) {
  button.onclick = () => { unlockAudio(); return converse(translate(button.dataset.command)); };
}
renderTopic();
for (const item of history.slice(-80)) say(inRoom && item.role === 'assistant' ? item.speaker + ': ' + parseReply(item.text, item.speaker, true).text : item.text, item.role === 'user', item.role === 'user' || !translations[item.text]);
const returning = localStorage.getItem(topicStorageKey);
if (!inRoom) say(returning ? reply('我回来了') : 'Hi. Want to leave something for tomorrow?');
saveMember();
</script>
</body>
</html>
